<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Donor | LifeDrop</title>

    <link rel="stylesheet" href="update.css">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="container">

            <a href="../index.html" class="logo">
                ❤️ LifeDrop
            </a>

            <nav>
                <a href="all-donor-list.html">Donor List</a>
                <a href="donor-add.html">Add Donor</a>
                <a href="update.html" class="active">Update Donor</a>
                <a href="donor-remove.html">Remove Donor</a>
            </nav>
        </div>
    </header>
    <!-- Update Section -->

    <section class="update-section">
        <div class="update-card">
            <h1>Update Donor Information</h1>
            <p>Search a donor by ID, Name or Phone Number and update the information.</p>
            <!-- Search Box -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchId"
                    placeholder="Enter Donor ID, Name or Phone Number">

                <button id="searchBtn">
                    Search
                </button>

            </div>

            <!-- Search Result -->

            <div id="searchResult" class="search-result" style="display:none;">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Blood Group</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>

            <!-- Update Form -->

            <form id="updateForm">

                <input
                    type="hidden"
                    id="donorId">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        required>
                </div>

                <div class="form-group">

                    <label>Age</label>
                    <input
                        type="number"
                        id="age"
                        required>

                </div>

                <div class="form-group">

                    <label>Gender</label>

                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>

                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="form-group">

                    <label>Phone</label>
                    <input
                        type="text"
                        id="phone"
                        required>
                </div>
                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>

                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        id="address"
                        rows="3"
                        required></textarea>

                </div>

                <div class="form-group">
                    <label>Last Donation Date</label>

                    <input
                        type="date"
                        id="lastDonation"
                        required>
                </div>

                <button
                    type="submit"
                    class="update-btn">
                    Update Donor
                </button>
            </form>
        </div>
    </section>

    <script src="update.js"></script>

</body>

</html>
