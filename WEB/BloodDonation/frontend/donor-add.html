<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Donor | LifeDrop</title>

    <link rel="stylesheet" href="donor-add.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <div class="container">

            <a href="../index.html" class="logo">
                🩸 <span>LifeDrop</span>
            </a>

            <nav>
                
                <a href="all-donor-list.html">Donor List</a>
                <a href="donor-add.html" class="active">Add Donor</a>
                <a href="update.html">Update Donor</a>
                <a href="donor-remove.html">Remove Donor</a>
            </nav>

        </div>
    </header>

    <!-- ================= FORM ================= -->

    <main>

        <section class="form-section">
            <div class="form-card">
                <h1>Add New Donor</h1>
                <p>
                    Fill in the donor information below to register a new blood donor.
                </p>
                <form
                    id="donorForm"
                    action="../backend/add_donor.php"
                    method="POST"
                >

                    <!-- Full Name -->
                    <div class="input-group">
                        <label for="full_name">Full Name</label>

                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            placeholder="Enter full name"
                            required
                        >
                    </div>
                    <!-- Age -->
                    <div class="input-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="18"
                            max="65"
                            placeholder="Enter age"
                            required
                        >
                    </div>

                    <!-- Gender -->

                    <div class="input-group">

                        <label>Gender</label>

                        <div class="radio-group">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                    required
                                >
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                >
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                >
                                Other
                            </label>

                        </div>

                    </div>

                    <!-- Blood Group -->

                    <div class="input-group">

                        <label for="blood_group">
                            Blood Group
                        </label>

                        <select
                            id="blood_group"
                            name="blood_group"
                            required
                        >

                            <option value="">
                                Select Blood Group
                            </option>

                            <option>A+</option>
                            <option>A-</option>

                            <option>B+</option>
                            <option>B-</option>

                            <option>AB+</option>
                            <option>AB-</option>

                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>

                    <!-- Phone -->

                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="01XXXXXXXXX"
                            required
                        >

                    </div>

                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>

                    <!-- Address -->

                    <div class="input-group">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            rows="4"
                            placeholder="Enter complete address"
                            required
                        ></textarea>

                    </div>

                    <!-- Last Donation -->

                    <div class="input-group">

                        <label for="last_donation">
                            Last Donation Date
                        </label>

                        <input
                            type="date"
                            id="last_donation"
                            name="last_donation"
                            required
                        >

                    </div>

                    <!-- Buttons -->

                    <div class="button-group">

                        <button
                            type="submit"
                            class="btn-submit"
                        >
                            Add Donor
                        </button>

                        <button
                            type="reset"
                            class="btn-reset"
                        >
                            Clear Form
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <script src="donor-add.js"></script>

</body>
</html>
